#Workflow designed by Claude
#The goal is to render the readme every time as the datasets
#might have been updated and the Rmd doesn't detect
#the change automatically (the dataset list comes from data(package))
on:
  push:
    branches: [main, master]
    paths:
      - README.Rmd
      - 'R/**'
      - 'data/**'
      - DESCRIPTION

name: Render README

permissions:
  contents: write

jobs:
  render-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::printr
            local::.
          needs: readme

      - name: Render README
        run: Rscript -e 'knitr::knit("README.Rmd", output = "README.md")'

      - name: Commit and push README.md
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d man/figures ]; then
            git add man/figures
          fi
          git diff --cached --quiet || git commit -m "Auto-render README.md from README.Rmd [skip ci]"
          git push
